name: Markdown Linter
on:
  push:
    branches:
      - v0.38.x-celestia
      - main
    paths:
      - "**.md"
      - "**.yml"
      - "**.yaml"
  pull_request:
    branches:
      - v0.38.x-celestia
      - main
    paths:
      - "**.md"
      - "**.yml"
  merge_group:

permissions:
  contents: read

# Cancel superseded runs when a pull request gets a new push. Other events get
# a unique group so GitHub never queues or drops their pending runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Super linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Lint Code Base
        uses: docker://github/super-linter:v4
        env:
          VALIDATE_ALL_CODEBASE: true
          DEFAULT_BRANCH: v0.38.x-celestia
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_MD: true
          VALIDATE_OPENAPI: true
          VALIDATE_YAML: true
          YAML_CONFIG_FILE: yaml-lint.yml
