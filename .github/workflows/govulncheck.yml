name: Check for Go vulnerabilities
# Runs https://pkg.go.dev/golang.org/x/vuln/cmd/govulncheck daily and on every
# push to main, since new advisories land without any change in this repo.
# Failures on main are reported to #protocol-ci by notify-protocol-ci.yml.
#
# Pull requests only run it when dependencies change, so an advisory with no
# stable fix yet doesn't turn every unrelated PR red.
#
# Run `make vulncheck` from the root of the repo to run this workflow locally.
on:
  workflow_dispatch:  # allow running workflow manually
  schedule:
    - cron: '0 4 * * *'
  pull_request:
    paths:
      - go.mod
      - go.sum
      - .github/workflows/govulncheck.yml
  push:
    branches:
      - main

permissions:
  contents: read

# Cancel superseded runs when a pull request gets a new push. Other events get
# a unique group so GitHub never queues or drops their pending runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          check-latest: true
      - name: govulncheck
        run: make vulncheck
