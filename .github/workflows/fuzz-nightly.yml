# Runs the native Go fuzz targets listed in test/fuzz/README.md nightly.
# Failures on main are reported to #protocol-ci by notify-protocol-ci.yml,
# which watches this workflow by name.
name: Fuzz Tests
on:
  workflow_dispatch:  # allow running workflow manually
  schedule:
    - cron: '0 3 * * *'
  pull_request:
    paths:
      - "**.go"
      - "**/testdata/fuzz/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/fuzz-nightly.yml"

permissions:
  contents: read

# Cancel superseded runs when a pull request gets a new push. Other events get
# a unique group so GitHub never queues or drops their pending runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {package: test/fuzz/tests, target: Mempool}
          - {package: test/fuzz/tests, target: P2PSecretConnection}
          - {package: p2p, target: TransportUpgrade}
          - {package: p2p, target: PeerReceive}
          - {package: p2p/conn, target: SecretConnectionHandshake}
          - {package: p2p/conn, target: SecretConnectionRead}
          - {package: p2p/conn, target: MConnectionRecv}
          - {package: test/fuzz/tests, target: RPCJSONRPCServer}
          - {package: rpc/core, target: RPCCoreHandlers}
          - {package: rpc/core, target: RPCCoreJSONRPC}
          - {package: mempool/cat, target: MempoolMessage}
          - {package: mempool/cat, target: ReactorReceive}
          - {package: consensus, target: ConsensusMessage}
          - {package: consensus, target: ConsensusStateHandleMsg}
          - {package: consensus, target: ConsensusReactorReceive}
          - {package: blocksync, target: BlockSyncMessage}
          - {package: statesync, target: StateSyncReactor}
          - {package: blocksync, target: BlockSyncReactor}
          - {package: consensus/propagation/types, target: PropagationMessage}
          - {package: consensus/propagation/types, target: CombinedPartSetDecode}
          - {package: consensus/propagation/types, target: TxsToPartsMetadata}
          - {package: consensus/propagation/types, target: TxsToParts}
          - {package: consensus/propagation/types, target: TxsToParts_Panic}
          - {package: consensus/propagation, target: PropagationReactor}
          - {package: types, target: BlockFromProto}
          - {package: types, target: PartFromProto}
          - {package: types, target: VoteFromProto}
          - {package: types, target: ProposalFromProto}
          - {package: types, target: CommitFromProto}
          - {package: types, target: VerifyCommit}
          - {package: types, target: ExtendedCommitFromProto}
          - {package: types, target: LightBlockFromProto}
          - {package: types, target: ValidatorSetFromProto}
          - {package: types, target: EvidenceFromProto}
          - {package: evidence, target: EvidencePool}
          - {package: evidence, target: EvidenceReactorReceive}
          - {package: types, target: UnwrapLegacyBlobTx}
          - {package: light, target: LightClientVerify}
          - {package: light/provider/http, target: HTTPProviderLightBlock}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Locate fuzz cache
        id: fuzz-cache
        run: echo "path=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"

      - name: Restore fuzz corpus
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.fuzz-cache.outputs.path }}
          key: fuzz-${{ runner.os }}-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-${{ runner.os }}-${{ matrix.target }}-

      # Fuzz for 10 minutes on the nightly schedule; keep pull request runs
      # short since they only check that the targets still build and run.
      - name: Fuzz
        env:
          FUZZ_PACKAGE: ${{ matrix.package }}
          FUZZ_TARGET: Fuzz${{ matrix.target }}
          FUZZTIME: ${{ github.event_name == 'pull_request' && '30s' || '10m' }}
        run: go test -run='^$' -fuzz="^${FUZZ_TARGET}$" -fuzztime="$FUZZTIME" -parallel=2 "./${FUZZ_PACKAGE}"

      # Go writes any input that triggered a failure to testdata/fuzz/<Target>/.
      - name: Archive failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failing-inputs-${{ matrix.target }}
          path: ${{ matrix.package }}/testdata/fuzz/Fuzz${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 7
