version: 2
updates:
  # GitHub Actions configurations
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    target-branch: "main"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - automerge

  # Go package configurations
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    target-branch: "main"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - automerge
    ignore:
      # v1.84.0 is affected by GO-2026-6443. Remove once v1.84.1+ or v1.85.0 is out.
      - dependency-name: google.golang.org/grpc
        versions: ["1.84.0"]
