version: 2
# Titles must carry a review level tag (see README.md#contributing). The trailing
# space in each prefix stops Dependabot from appending a colon after the tag.
updates:
  # GitHub Actions configurations
  - package-ecosystem: github-actions
    directory: "/"
    commit-message:
      prefix: "build(deps): [medium] "
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    target-branch: "main"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - automerge

  # Go package configurations
  - package-ecosystem: gomod
    directory: "/"
    commit-message:
      prefix: "build(deps): [high] "
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    target-branch: "main"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - automerge
    ignore:
      # govulncheck flags v1.84.0 for GO-2026-6443 because the advisory's range covers it,
      # even though the release contains the fix. Remove once the range is corrected or v1.85.0 ships.
      - dependency-name: google.golang.org/grpc
        versions: ["1.84.0"]
