name: "Release"
# Syncs each stable release tag with the celestia-core release pipeline in
# Linear: https://linear.app/celestia/pipeline/celestia-core/releases
#
# GitHub releases themselves are created by hand. Binaries are not published
# from this repo; celestia-app consumes it as a Go module.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"  # Push events to matching v*, i.e. v1.0, v20.15.10

permissions:
  contents: read

