syntax = "proto3";
package tendermint.blocksync;

import "gogoproto/gogo.proto";

option go_package = "github.com/cometbft/cometbft/proto/tendermint/blocksync";


// SigCountMessage is a stripped down view of Message used by the blocksync
// MsgBytesFilter for validation before unmarshalling the full BlockResponse
// Message. Only the BlockResponse oneof case is modelled, and only the path
// down to {Block,Extended}Commit.signatures.
message SigCountMessage {
  SigCountBlockResponse block_response = 3;
}

message SigCountBlockResponse {
  SigCountBlock block = 1;
  SigCountExtendedCommit ext_commit = 2;
}

message SigCountBlock {
  SigCountEvidenceList evidence    = 3;
  SigCountCommit       last_commit = 4;
}

// SigCountEvidenceList models Block.evidence down to every repeated signature
// and validator list a Commit can be reached through, so that signatures nested
// inside evidence are subject to the same count cap as last_commit.
message SigCountEvidenceList {
  repeated SigCountEvidence evidence = 1 [(gogoproto.nullable) = false];
}

message SigCountEvidence {
  // Only light_client_attack_evidence (field 2) nests repeated signature and
  // validator lists; duplicate_vote_evidence (field 1) does not and is skipped.
  SigCountLightClientAttackEvidence light_client_attack_evidence = 2;
}

message SigCountLightClientAttackEvidence {
  SigCountLightBlock conflicting_block    = 1;
  repeated bytes     byzantine_validators = 3 [
    (gogoproto.customtype) = "NoSig",
    (gogoproto.nullable) = false
  ];
}

message SigCountLightBlock {
  SigCountSignedHeader signed_header = 1;
  SigCountValidatorSet validator_set = 2;
}

message SigCountSignedHeader {
  SigCountCommit commit = 2;
}

message SigCountValidatorSet {
  repeated bytes validators = 1 [
    (gogoproto.customtype) = "NoSig",
    (gogoproto.nullable) = false
  ];
}

message SigCountCommit {
  repeated bytes signatures = 4 [
    (gogoproto.customtype) = "NoSig",
    (gogoproto.nullable) = false
  ];
}

message SigCountExtendedCommit {
  repeated bytes extended_signatures = 4 [
    (gogoproto.customtype) = "NoSig",
    (gogoproto.nullable) = false
  ];
}
