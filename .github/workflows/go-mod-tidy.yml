name: Go mod tidy

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

# Cancel superseded runs when a pull request gets a new push. Other events get
# a unique group so GitHub never queues or drops their pending runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-mod-tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: Check go.mod and go.sum are tidy
        # If this fails, run go mod tidy locally and commit the changes.
        run: go mod tidy -diff
