version: 2
updates:
  # GitHub Actions configurations
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    target-branch: "main"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - automerge

  # Go package configurations
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    target-branch: "main"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - automerge
    ignore:
      # govulncheck flags v1.84.0 for GO-2026-6443 because the advisory's range covers it,
      # even though the release contains the fix. Remove once the range is corrected or v1.85.0 ships.
      - dependency-name: google.golang.org/grpc
        versions: ["1.84.0"]
