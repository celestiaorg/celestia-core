name: Protobuf Lint
# Lints the protobuf definitions and, on pull requests, checks them for
# breaking changes against the base branch. Add the `buf skip breaking` label
# to a PR that intentionally breaks the proto API.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'proto/**'
      - '.github/workflows/proto-lint.yml'
  merge_group:
  push:
    branches:
      - main
    paths:
      - 'proto/**'

permissions:
  contents: read

# Cancel superseded runs when a pull request gets a new push. Other events get
# a unique group so GitHub never queues or drops their pending runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          # Matches the buf pin #3386 adds to the Makefile; keep the two in sync.
          version: 1.72.0
          input: proto
          # buf-action only lints pull requests by default; keep linting pushes.
          lint: true
          breaking_against: ${{ github.event.repository.clone_url }}#format=git,commit=${{ github.event.pull_request.base.sha }},subdir=proto
          # Protos are formatted with clang-format (make proto-format), not buf.
          format: false
          push: false
          archive: false
          pr_comment: false
