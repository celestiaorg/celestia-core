name: Protobuf Lint
on:
  pull_request:
    paths:
      - 'proto/**'
  merge_group:
  push:
    branches:
      - v0.38.x-celestia
      - main
    paths:
      - 'proto/**'

permissions:
  contents: read

# Cancel superseded runs when a pull request gets a new push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-setup-action@v1.50.0
      - uses: bufbuild/buf-lint-action@v1
        with:
          input: 'proto'
