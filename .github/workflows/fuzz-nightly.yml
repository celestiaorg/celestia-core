# Runs the native Go fuzz tests in test/fuzz nightly. Failures on main are
# reported to #protocol-ci by notify-protocol-ci.yml, which watches this
# workflow by name.
name: Fuzz Tests
on:
  workflow_dispatch:  # allow running workflow manually
  schedule:
    - cron: '0 3 * * *'
  pull_request:
    paths:
      - "test/fuzz/**"
      - ".github/workflows/fuzz-nightly.yml"

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [Mempool, P2PSecretConnection, RPCJSONRPCServer]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      # Fuzz for 10 minutes on the nightly schedule; keep pull request runs
      # short since they only check that the targets still build and run.
      - name: Fuzz
        working-directory: test/fuzz/tests
        env:
          FUZZTIME: ${{ github.event_name == 'pull_request' && '30s' || '10m' }}
        run: go test -run='^$' -fuzz='^Fuzz${{ matrix.target }}$' -fuzztime="$FUZZTIME" .

      # Go writes any input that triggered a failure to testdata/fuzz/<Target>/.
      - name: Archive failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failing-inputs-${{ matrix.target }}
          path: test/fuzz/tests/testdata/fuzz/Fuzz${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 7
